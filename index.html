function darkenColor(color, factor = 0.35) {
    const match = color.match(/\d+/g);

    if (!match) {
        return color;
    }

    const [r, g, b] = match.map(Number);
    const darkened = [
        Math.round(r * (1 - factor)),
        Math.round(g * (1 - factor)),
        Math.round(b * (1 - factor))
    ];

    return `rgb(${darkened[0]}, ${darkened[1]}, ${darkened[2]})`;
}

function getEnemySizeFromMaxHp(maxHp) {
    if (maxHp <= 1) {
        return 16;
    }

    const sizeMultiplier =
        Math.log10(Math.log10(maxHp)) + 1;

    return 32 * sizeMultiplier;
}

function drawRegularPolygon(ctx, radius, sides) {
    ctx.beginPath();

    for (let i = 0; i < sides; i++) {
        const angle =
            -Math.PI / 2 +
            (i / sides) * Math.PI * 2;

        const x =
            Math.cos(angle) * radius;
        const y =
            Math.sin(angle) * radius;

        if (i === 0) {
            ctx.moveTo(x, y);
        } else {
            ctx.lineTo(x, y);
        }
    }

    ctx.closePath();
}

function drawEnemyShape(ctx, enemy, fillColor, innerColor) {
    const radius = enemy.size / 2;

    ctx.fillStyle = fillColor;

    if (enemy.supersplitter) {
        drawRegularPolygon(ctx, radius, 6);
        ctx.fill();
    } else if (enemy.splitter) {
        drawRegularPolygon(ctx, radius, 5);
        ctx.fill();
    } else {
        ctx.fillRect(
            -enemy.size / 2,
            -enemy.size / 2,
            enemy.size,
            enemy.size
        );
    }

    const innerRadius = radius * 0.55;
    ctx.fillStyle = innerColor;

    if (enemy.supersplitter) {
        drawRegularPolygon(ctx, innerRadius, 6);
        ctx.fill();
    } else if (enemy.splitter) {
        drawRegularPolygon(ctx, innerRadius, 5);
        ctx.fill();
    } else {
        const innerSquareSize = innerRadius * 2;
        ctx.fillRect(
            -innerSquareSize / 2,
            -innerSquareSize / 2,
            innerSquareSize,
            innerSquareSize
        );
    }
}

function getEnemyPreviewImage(config) {
    const previewCanvas = document.createElement("canvas");
    previewCanvas.width = 64;
    previewCanvas.height = 64;
    const previewCtx = previewCanvas.getContext("2d");

    const baseColor = getEnemyColor(config.maxHp);
    const color = config.armored ? darkenColor(baseColor, 0.35) : baseColor;
    const innerColor = config.armored ? darkenColor(getEnemyInnerColor(config.maxHp), 0.25) : getEnemyInnerColor(config.maxHp);
    const previewSize = config.size || getEnemySizeFromMaxHp(config.maxHp);

    previewCtx.translate(32, 32);
    previewCtx.rotate(Math.random() * Math.PI * 2);

    previewCtx.fillStyle = color;

    if (config.supersplitter) {
        drawRegularPolygon(previewCtx, previewSize / 2, 6);
        previewCtx.fill();
    } else if (config.splitter) {
        drawRegularPolygon(previewCtx, previewSize / 2, 5);
        previewCtx.fill();
    } else {
        previewCtx.fillRect(
            -previewSize / 2,
            -previewSize / 2,
            previewSize,
            previewSize
        );
    }

    previewCtx.fillStyle = innerColor;
    const innerRadius = (previewSize / 2) * 0.55;

    if (config.supersplitter) {
        drawRegularPolygon(previewCtx, innerRadius, 6);
        previewCtx.fill();
    } else if (config.splitter) {
        drawRegularPolygon(previewCtx, innerRadius, 5);
        previewCtx.fill();
    } else {
        const innerSquareSize = innerRadius * 2;
        previewCtx.fillRect(
            -innerSquareSize / 2,
            -innerSquareSize / 2,
            innerSquareSize,
            innerSquareSize
        );
    }

    return previewCanvas.toDataURL("image/png");
}

function createEnemyBadgeCanvas(enemy, size = 18) {
    const badgeCanvas = document.createElement("canvas");
    badgeCanvas.width = size;
    badgeCanvas.height = size;
    const badgeCtx = badgeCanvas.getContext("2d");

    const baseColor = getEnemyColor(enemy.hp);
    const color = enemy.armored ? darkenColor(baseColor, 0.35) : baseColor;
    const baseInnerColor = getEnemyInnerColor(enemy.hp);
    const innerColor = enemy.armored ? darkenColor(baseInnerColor, 0.25) : baseInnerColor;

    badgeCtx.translate(size / 2, size / 2);
    badgeCtx.rotate(enemy.rotation || 0);

    drawEnemyShape(
        badgeCtx,
        {
            size: size * 0.9,
            splitter: Boolean(enemy.splitter),
            armored: Boolean(enemy.armored)
        },
        color,
        innerColor
    );

    return badgeCanvas;
}

function drawBossHealthBar(enemy, yOffset = 18) {
    if (!enemy.boss) {
        return;
    }

    const barWidth = Math.min(canvas.width * 0.7, Math.max(220, enemy.size * 3.2));
    const barHeight = 12;
    const barY = yOffset;
    const x = canvas.width / 2 - barWidth / 2;
    const fillWidth = (enemy.hp / enemy.maxHp) * barWidth;
    const badgeSize = 18;

    ctx.fillStyle = "#1a1a1a";
    ctx.fillRect(
        x,
        barY,
        barWidth,
        barHeight
    );

    ctx.fillStyle = getEnemyColor(enemy.hp);
    ctx.fillRect(
        x,
        barY,
        fillWidth,
        barHeight
    );

    const leftBadge = createEnemyBadgeCanvas(enemy, badgeSize);
    const rightBadge = createEnemyBadgeCanvas(enemy, badgeSize);

    ctx.drawImage(
        leftBadge,
        x - badgeSize - 6,
        barY - badgeSize / 2 + 2,
        badgeSize,
        badgeSize
    );

    ctx.drawImage(
        rightBadge,
        x + barWidth + 6,
        barY - badgeSize / 2 + 2,
        badgeSize,
        badgeSize
    );

    ctx.fillStyle = "white";
    ctx.font = "bold 12px Arial";
    ctx.textAlign = "center";
    ctx.fillText(
        enemy.bossName || "Boss",
        canvas.width / 2,
        barY - 8
    );
}

function getBossPriority(enemy) {
    const ageMs = Math.max(1, Date.now() - (enemy.createdAt || Date.now()));
    return (enemy.maxHp || enemy.hp || 1) * ageMs;
}

function drawBossBars() {
    const bossEnemies = enemies
        .filter(enemy => enemy.boss)
        .sort((a, b) => getBossPriority(b) - getBossPriority(a));

    bossEnemies.forEach((enemy, index) => {
        drawBossHealthBar(enemy, 18 + index * 26);
    });
}

    return 3 +

function createEnemyConfigFromSliders() {
    const maxHp =
        Number(enemyMaxHpSlider.value);

    const damage =
        Number(enemyDamageSlider.value);

    const splitter =
        enemySplitterModifier.checked ||
        enemySuperSplitterModifier.checked;

    const supersplitter =
        enemySuperSplitterModifier.checked &&
        enemyCapUpgradePurchased;

    const bossNameRaw =
        enemyNameInput.value.trim();

    const boss =
        enemyBossModifier.checked &&
        enemyCapUpgradePurchased &&
        enemyNameIsValid(bossNameRaw);

    const effectiveMaxHp = supersplitter ? maxHp * 2 : maxHp;

    const size =
        getEnemySizeFromMaxHp(effectiveMaxHp) *
        (supersplitter ? 1.8 : (splitter ? 1.25 : 1)) *
        (boss ? 1.35 : 1);

    return {
        maxHp: effectiveMaxHp,
        damage,
        armored: enemyArmoredModifier.checked,
        splitter,
        supersplitter,
        boss,
        bossName: boss ? bossNameRaw : "",
        size
    };
}

function spawnEnemyFromConfig(config) {

// ========================
// ENEMY COLOR
// ========================

function getEnemyColor(hp) {

    const clampedHp =
        Math.max(
            1,
            hp
        );

    if (clampedHp <= 1000) {
        const t =
            Math.log10(clampedHp) /
            Math.log10(1000);

        const red = Math.round(255 * t);
        const green = 255;
        const blue = 0;

        return `rgb(${red}, ${green}, ${blue})`;
    }

    const minHp = 1000;
    const maxHp = 1000000;
    const normalized =
        Math.min(
            1,
            (clampedHp - minHp) /
            (maxHp - minHp)
        );

    const red = 255;
    const green = Math.round(255 * (1 - normalized));
    const blue = 0;

    return `rgb(${red}, ${green}, ${blue})`;
}

function getEnemyInnerColor(hp) {
    const base = getEnemyColor(hp);
    const match = base.match(/\d+/g);

    if (!match) {
        return base;
    }

    const [r, g, b] = match.map(Number);
    const mix = 0.32;

    const innerR = Math.round(r + (255 - r) * mix);
    const innerG = Math.round(g + (255 - g) * mix);
    const innerB = Math.round(b + (255 - b) * mix);

    return `rgb(${innerR}, ${innerG}, ${innerB})`;
}

// ATTACK
// ========================

canvas.addEventListener(
    "mousedown",
    (event) => {

        if (event.button === 0) {
            attack();
        }

    }
);


function attack() {

    if (player.dead) {
        return;
    }

    const now =
        performance.now();

    if (
        now - player.lastAttackTime <
        player.attackCooldown
    ) {
        return;
    }

    player.lastAttackTime =
        now;

    player.attacking = true;

    player.attackTimer = 0;

    player.swordAngle =
        Math.atan2(
            mouse.y - player.y,
            mouse.x - player.x
        );

    for (const enemy of enemies) {
        enemy.hitThisSwing = false;
    }
}


// ========================
// SWORD / ENEMY COLLISION
// ========================

function checkSwordHits() {

    if (!player.attacking) {
        return;
    }

    const swordStart = 27;
    const swordEnd = 62;

    const swordX =
        Math.cos(player.swordAngle);

    const swordY =
        Math.sin(player.swordAngle);


    for (
        let i = enemies.length - 1;
        i >= 0;
        i--
    ) {

        const enemy = enemies[i];

        if (enemy.hitThisSwing) {
            continue;
        }

        const dx =
            enemy.x - player.x;

        const dy =
            enemy.y - player.y;

        const projection =
            dx * swordX +
            dy * swordY;

        if (
            projection < swordStart ||
            projection > swordEnd
        ) {
            continue;
        }

        const perpendicularDistance =
            Math.abs(
                dx * swordY -
                dy * swordX
            );

        const hitDistance =
            enemy.size / 2 + 5;

        if (
            perpendicularDistance <=
            hitDistance
        ) {

            enemy.hitThisSwing = true;

            let damageTaken =
                player.attackDamage;

            if (enemy.armored) {
                damageTaken =
                    Math.ceil(
                        damageTaken / 2
                    );
            }

            enemy.hp -= damageTaken;


            const distance =
                Math.sqrt(
                    dx * dx +
                    dy * dy
                );

            if (distance > 0) {

                enemy.vx +=
                    (dx / distance) *
                    0.7;

                enemy.vy +=
                    (dy / distance) *
                    0.7;
            }


            if (enemy.hp <= 0) {

                coins +=
                    Math.sqrt(
                        enemy.maxHp
                    );

                if (enemy.supersplitter) {
                    const childHp = Math.max(1, Math.floor(enemy.maxHp / 3));
                    const splitOffset = enemy.size * 0.95;

                    const spawnChild = (index, offsetX, offsetY) => {
                        const child = spawnEnemyFromConfig({
                            maxHp: childHp,
                            damage: Math.max(1, Math.floor(enemy.damage / 2)),
                            size: getEnemySizeFromMaxHp(childHp) * 1.25,
                            armored: enemy.armored,
                            splitter: true,
                            supersplitter: false,
                            boss: false,
                            bossName: ""
                        });

                        child.x = enemy.x + offsetX * splitOffset;
                        child.y = enemy.y + offsetY * splitOffset;
                        child.vx = (offsetX || 0) * 2.4;
                        child.vy = (offsetY || 0) * 2.4;
                        child.rotation = (Math.PI * 2 / 3) * index;
                    };

                    spawnChild(0, -1, 0);
                    spawnChild(1, 0.5, -0.86);
                    spawnChild(2, 0.5, 0.86);
                } else if (enemy.splitter) {
                    const firstChildHp =
                        Math.max(
                            1,
                            Math.floor(enemy.maxHp / 2)
                        );

                    const secondChildHp =
                        Math.max(
                            1,
                            enemy.maxHp - firstChildHp
                        );

                    const splitOffset =
                        enemy.size * 0.9;

                    const spawnChild = (childHp, sign) => {
                        const child = spawnEnemyFromConfig({
                            maxHp: childHp,
                            damage: Math.max(1, Math.floor(enemy.damage / 2)),
                            size: getEnemySizeFromMaxHp(childHp),
                            armored: enemy.armored,
                            splitter: false,
                            supersplitter: false,
                            boss: false,
                            bossName: ""
                        });

                        child.x = enemy.x + sign * splitOffset;
                        child.y = enemy.y + (Math.random() - 0.5) * splitOffset;
                        child.vx = sign * 2.2;
                        child.vy = (Math.random() - 0.5) * 2.2;
                    };

                    spawnChild(firstChildHp, -1);
                    spawnChild(secondChildHp, 1);
                }

                enemies.splice(i, 1);

                updateUpgradeUI();

                continue;
            }
        }
    }
}


// ========================
// DAMAGE PLAYER
// ========================

function damagePlayer(
    damage,
    enemy
) {

    if (player.dead) {
        return;
    }

    player.hp -= damage;


    const dx =
        player.x - enemy.x;

    const dy =
        player.y - enemy.y;

    const distance =
        Math.sqrt(
            dx * dx +
            dy * dy
        );


    if (distance > 0) {

        player.vx +=
            (dx / distance) *
            5;

        player.vy +=
            (dy / distance) *
            5;
    }


    if (player.hp <= 0) {
        killPlayer();
    }
}


// ========================
// PLAYER DEATH
// ========================

function killPlayer() {

    player.hp = 0;

    player.dead = true;

    player.attacking = false;

    player.vx = 0;
    player.vy = 0;

    player.respawnTimer = 3;
}


// ========================
// FIND FARTHEST SPAWN
// ========================

function findFarthestSpawnPoint() {

    if (enemies.length === 0) {

        return {
            x: canvas.width / 2,
            y: canvas.height / 2
        };
    }


    const padding = player.radius + 5;

    const candidates = [];

    const spacing = 50;

    for (
        let x = padding;
        x <= canvas.width - padding;
        x += spacing
    ) {

        for (
            let y = padding;
            y <= canvas.height - padding;
            y += spacing
        ) {

            candidates.push({
                x: x,
                y: y
            });
        }
    }


    candidates.push(
        { x: padding, y: padding },
        {
            x: canvas.width - padding,
            y: padding
        },
        {
            x: padding,
            y: canvas.height - padding
        },
        {
            x: canvas.width - padding,
            y: canvas.height - padding
        },
        {
            x: canvas.width / 2,
            y: canvas.height / 2
        }
    );


    let bestPoint =
        candidates[0];

    let bestDistance = -Infinity;


    for (const candidate of candidates) {

        let nearestEnemyDistance =
            Infinity;


        for (const enemy of enemies) {

            const dx =
                candidate.x - enemy.x;

            const dy =
                candidate.y - enemy.y;

            const distance =
                Math.sqrt(
                    dx * dx +
                    dy * dy
                );

            if (
                distance <
                nearestEnemyDistance
            ) {
                nearestEnemyDistance =
                    distance;
            }
        }


        if (
            nearestEnemyDistance >
            bestDistance
        ) {

            bestDistance =
                nearestEnemyDistance;

            bestPoint =
                candidate;
        }
    }


    return bestPoint;
}


// ========================
// RESPAWN
// ========================

function respawnPlayer() {

    const spawn =
        findFarthestSpawnPoint();

    player.x = spawn.x;
    player.y = spawn.y;

    player.vx = 0;
    player.vy = 0;

    player.hp =
        player.maxHp;

    player.dead = false;

    player.respawnTimer = 0;
}


// ========================
// ENEMY DASH
// ========================

function updateEnemyDash(
    enemy,
    deltaTime
) {

    enemy.dashTimer -=
        deltaTime;


    const dx =
        player.x - enemy.x;

    const dy =
        player.y - enemy.y;

    const distance =
        Math.sqrt(
            dx * dx +
            dy * dy
        );


    if (
        !enemy.dashing &&
        !player.dead &&
        distance >= 50 &&
        enemy.dashTimer <= 0
    ) {

        if (distance > 0) {

            enemy.vx +=
                (dx / distance) *
                enemy.dashSpeed;

            enemy.vy +=
                (dy / distance) *
                enemy.dashSpeed;
        }

        enemy.dashing = true;

        enemy.canDamagePlayer = true;

        enemy.dashTimer =
            randomDashCooldown();
    }


    if (
        enemy.dashing &&
        Math.abs(enemy.vx) < 1 &&
        Math.abs(enemy.vy) < 1
    ) {

        enemy.dashing = false;
    }
}


// ========================
// ENEMY / PLAYER COLLISION
// ========================

function checkEnemyPlayerCollision(
    enemy
) {

    if (player.dead) {
        return;
    }

    const dx =
        player.x - enemy.x;

    const dy =
        player.y - enemy.y;

    const distance =
        Math.sqrt(
            dx * dx +
            dy * dy
        );

    const collisionDistance =
        player.radius +
        enemy.size / 2;


    if (
        distance <=
        collisionDistance
    ) {

        if (
            enemy.canDamagePlayer
        ) {

            const damage =
                enemy.damage;

            damagePlayer(
                damage,
                enemy
            );

            enemy.canDamagePlayer =
                false;


            if (distance > 0) {

                enemy.vx -=
                    (dx / distance) *
                    0.5;

                enemy.vy -=
                    (dy / distance) *
                    0.5;
            }

        }


        if (distance > 0) {

            const overlap =
                collisionDistance -
                distance;

            player.x +=
                (dx / distance) *
                overlap *
                0.5;

            player.y +=
                (dy / distance) *
                overlap *
                0.5;

            enemy.x -=
                (dx / distance) *
                overlap *
                0.5;

            enemy.y -=
                (dy / distance) *
                overlap *
                0.5;
        }


        enemy.dashing = false;
    }
}


// ========================
// ENEMY / ENEMY COLLISION
// ========================

function checkEnemyEnemyCollision(
    enemyA,
    enemyB
) {

    const dx =
        enemyB.x - enemyA.x;

    const dy =
        enemyB.y - enemyA.y;

    const distance =
        Math.sqrt(
            dx * dx +
            dy * dy
        );

    const collisionDistance =
        enemyA.size / 2 +
        enemyB.size / 2;


    if (
        distance < collisionDistance
    ) {

        if (distance === 0) {
            return;
        }

        const overlap =
            collisionDistance -
            distance;

        const nx =
            dx / distance;

        const ny =
            dy / distance;


        enemyA.x -=
            nx *
            overlap *
            0.5;

        enemyA.y -=
            ny *
            overlap *
            0.5;

        enemyB.x +=
            nx *
            overlap *
            0.5;

        enemyB.y +=
            ny *
            overlap *
            0.5;


        const relativeVx =
            enemyB.vx -
            enemyA.vx;

        const relativeVy =
            enemyB.vy -
            enemyA.vy;

        const relativeVelocity =
            relativeVx * nx +
            relativeVy * ny;


        if (
            relativeVelocity < 0
        ) {

            const bounce = 0.4;

            const impulse =
                -relativeVelocity *
                bounce;

            enemyA.vx -=
                nx *
                impulse;

            enemyA.vy -=
                ny *
                impulse;

            enemyB.vx +=
                nx *
                impulse;

            enemyB.vy +=
                ny *
                impulse;
        }
    }
}


// ========================
// UPDATE
// ========================

let lastFrameTime =
    performance.now();


function update() {

    const now =
        performance.now();

    const deltaTime =
        Math.min(
            (now - lastFrameTime) /
            1000,
            0.05
        );

    lastFrameTime = now;


    // ========================
    // PLAYER
    // ========================

    if (player.dead) {

        player.respawnTimer -=
            deltaTime;

        if (
            player.respawnTimer <= 0
        ) {
            respawnPlayer();
        }

    } else {

        // ========================
        // MOVEMENT
        // ========================

        let moveX = 0;
        let moveY = 0;

        if (keys["w"]) moveY -= 1;
        if (keys["s"]) moveY += 1;
        if (keys["a"]) moveX -= 1;
        if (keys["d"]) moveX += 1;


        if (
            moveX !== 0 ||
            moveY !== 0
        ) {

            const length =
                Math.sqrt(
                    moveX * moveX +
                    moveY * moveY
                );

            moveX /= length;
            moveY /= length;

            player.vx +=
                moveX *
                player.acceleration;

            player.vy +=
                moveY *
                player.acceleration;
        }


        // ========================
        // SPEED LIMIT
        // ========================

        const speed =
            Math.sqrt(
                player.vx * player.vx +
                player.vy * player.vy
            );

        if (
            speed >
            player.maxSpeed
        ) {

            player.vx =
                player.vx / speed *
                player.maxSpeed;

            player.vy =
                player.vy / speed *
                player.maxSpeed;
        }


        // ========================
        // FRICTION
        // ========================

        player.vx *=
            player.friction;

        player.vy *=
            player.friction;


        // ========================
        // MOVE
        // ========================

        player.x +=
            player.vx;

        player.y +=
            player.vy;


        // ========================
        // BORDER BOUNCE
        // ========================

        const bounce = 0.55;

        if (
            player.x -
            player.radius < 0
        ) {

            player.x =
                player.radius;

            if (player.vx < 0) {
                player.vx *=
                    -bounce;
            }
        }

        if (
            player.x +
            player.radius >
            canvas.width
        ) {

            player.x =
                canvas.width -
                player.radius;

            if (player.vx > 0) {
                player.vx *=
                    -bounce;
            }
        }

        if (
            player.y -
            player.radius < 0
        ) {

            player.y =
                player.radius;

            if (player.vy < 0) {
                player.vy *=
                    -bounce;
            }
        }

        if (
            player.y +
            player.radius >
            canvas.height
        ) {

            player.y =
                canvas.height -
                player.radius;

            if (player.vy > 0) {
                player.vy *=
                    -bounce;
            }
        }


        // ========================
        // SWORD SWING
        // ========================

        if (player.attacking) {

            player.attackTimer +=
                deltaTime * 1000;

            const progress =
                player.attackTimer /
                player.attackDuration;

            const targetAngle =
                Math.atan2(
                    mouse.y - player.y,
                    mouse.x - player.x
                );

            const startAngle =
                targetAngle -
                Math.PI / 2;

            player.swordAngle =
                startAngle +
                progress *
                Math.PI;


            checkSwordHits();


            if (
                progress >= 1
            ) {
                player.attacking =
                    false;
            }
        }
    }


    // ========================
    // ENEMIES
    // ========================

    for (const enemy of enemies) {

        enemy.rotation +=
            enemy.rotationSpeed *
            deltaTime;


        updateEnemyDash(
            enemy,
            deltaTime
        );


        enemy.vx *=
            enemy.friction;

        enemy.vy *=
            enemy.friction;

        enemy.x +=
            enemy.vx;

        enemy.y +=
            enemy.vy;


        const enemyBounce =
            0.4;

        const halfSize =
            enemy.size / 2;


        if (
            enemy.x -
            halfSize < 0
        ) {

            enemy.x =
                halfSize;

            if (enemy.vx < 0) {
                enemy.vx *=
                    -enemyBounce;
            }
        }


        if (
            enemy.x +
            halfSize >
            canvas.width
        ) {

            enemy.x =
                canvas.width -
                halfSize;

            if (enemy.vx > 0) {
                enemy.vx *=
                    -enemyBounce;
            }
        }


        if (
            enemy.y -
            halfSize < 0
        ) {

            enemy.y =
                halfSize;

            if (enemy.vy < 0) {
                enemy.vy *=
                    -enemyBounce;
            }
        }


        if (
            enemy.y +
            halfSize >
            canvas.height
        ) {

            enemy.y =
                canvas.height -
                halfSize;

            if (enemy.vy > 0) {
                enemy.vy *=
                    -enemyBounce;
            }
        }


        checkEnemyPlayerCollision(
            enemy
        );
    }


    // ========================
    // ENEMY / ENEMY COLLISIONS
    // ========================

    for (
        let i = 0;
        i < enemies.length;
        i++
    ) {

        for (
            let j = i + 1;
            j < enemies.length;
            j++
        ) {

            checkEnemyEnemyCollision(
                enemies[i],
                enemies[j]
            );
        }
    }
}


// ========================
// DRAW
// ========================

function draw() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    // ========================
    // ENEMIES
    // ========================

    for (const enemy of enemies) {

        const baseColor =
            getEnemyColor(
                enemy.hp
            );

        const color =
            enemy.armored
                ? darkenColor(baseColor, 0.35)
                : baseColor;

        const baseInnerColor =
            getEnemyInnerColor(
                enemy.hp
            );

        const innerColor =
            enemy.armored
                ? darkenColor(baseInnerColor, 0.25)
                : baseInnerColor;

        ctx.save();

        ctx.translate(
            enemy.x,
            enemy.y
        );

        ctx.rotate(
            enemy.rotation
        );

        drawEnemyShape(
            ctx,
            enemy,
            color,
            innerColor
        );

        ctx.restore();


        ctx.fillStyle =
            "white";

        ctx.font =
            "13px Arial";

        ctx.textAlign =
            "center";

        ctx.fillText(
            enemy.hp,
            enemy.x,
            enemy.y -
            enemy.size / 2 -
            7
        );
    }

    drawBossBars();

    // ========================
    // PLAYER
    // ========================

    if (!player.dead) {

        ctx.beginPath();

        ctx.arc(
            player.x,
            player.y,
            player.radius,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            "#2196ff";

        ctx.fill();

        ctx.lineWidth = 2;

        ctx.strokeStyle =
            "#66bbff";

        ctx.stroke();


        // ========================
        // SWORD
        // ========================

        if (player.attacking) {

            ctx.save();

            ctx.translate(
                player.x,
                player.y
            );

            ctx.rotate(
                player.swordAngle
            );


            ctx.beginPath();

            ctx.moveTo(9, 0);
            ctx.lineTo(27, 0);

            ctx.lineWidth = 5;
            ctx.strokeStyle =
                "#654321";

            ctx.stroke();


            ctx.beginPath();

            ctx.moveTo(24, -6);
            ctx.lineTo(24, 6);

            ctx.lineWidth = 3;
            ctx.strokeStyle =
                "#aaa";

            ctx.stroke();


            ctx.beginPath();

            ctx.moveTo(27, 0);
            ctx.lineTo(62, 0);

            ctx.lineWidth = 6;
            ctx.strokeStyle =
                "#ddd";

            ctx.stroke();


            ctx.beginPath();

            ctx.moveTo(62, 0);
            ctx.lineTo(54, -4);
            ctx.lineTo(54, 4);
            ctx.closePath();

            ctx.fillStyle =
                "#eee";

            ctx.fill();

            ctx.restore();
        }

    } else {

        ctx.fillStyle =
            "white";

        ctx.font =
            "24px Arial";

        ctx.textAlign =
            "center";

        ctx.fillText(
            "You died",
            canvas.width / 2,
            canvas.height / 2 - 15
        );

        ctx.font =
            "16px Arial";

        ctx.fillText(
            "Respawning in " +
            Math.ceil(
                player.respawnTimer
            ) +
            "...",
            canvas.width / 2,
            canvas.height / 2 + 15
        );
    }
}


// ========================
// GAME LOOP
// ========================

function gameLoop() {

    update();

    draw();

    hpText.textContent =
        player.hp;

    attackDamageText.textContent =
        player.attackDamage;

    coinsText.textContent =
        coins.toFixed(2);

    updateUpgradeUI();

    requestAnimationFrame(
        gameLoop
    );
}

gameLoop();

</script>
